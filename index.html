<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/simplebar@latest/dist/simplebar.css" />
    <link rel="stylesheet" href="dist/style.css" />
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
          "simplebar": "https://unpkg.com/simplebar@latest/dist/simplebar.min.js"
        }
      }
    </script>
  </head>

  <body>
    <div id="app">
      <div class="container">
        <div class="char-block">
          <div class="char a">A</div>
          <div class="char n">N</div>
          <div class="char i">I</div>
          <div class="char p">P</div>
          <div class="char l">L</div>
          <div class="char e">E</div>
          <div class="char x">X</div>
          <!-- 每个字符的修饰外框 -->
          <div class="rect a"></div>
          <div class="rect n"></div>
          <div class="rect i"></div>
          <div class="rect p"></div>
          <div class="rect l"></div>
          <div class="rect e"></div>
          <div class="rect x"></div>
          <!-- 【P】旋转角度(y轴 90deg)原因，需特殊处理 -->
          <div class="p-rect-90deg"></div>
        </div>

        <ul class="fold-panel">
          <li v-for="(it, idx) in foldList" :key="idx" :style="`background-image: url(${it.coverUrl})`">
            <div class="more-info" :style="`background-image: url(${it.bgUrl})`">
              <img class="character-pic" :src="`${it.artUrl}`" />
              <img class="element-pic" :src="`${it.elementUrl}`" />
              <div class="character-title">
                <img :src="`${it.titleUrl}`" />
              </div>
              <div class="cv-bar">
                <span>CV: {{ it.cv }}</span>
                <img
                  v-if="audioEnabled"
                  class="audio-pic audio-play"
                  src="img/语音-播放.gif"
                  @click="switchAudioEnabled"
                />
                <img v-else class="audio-pic" src="img/语音.png" @click="switchAudioEnabled" />
              </div>
              <div class="intro-box">
                <div
                  class="intro-content"
                  data-simplebar
                  data-simplebar-auto-hide="false"
                  v-html="it.introHtml"
                ></div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
