<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="dist/style.css">
</head>

<body>
  <div class="container">
    <div class="char-block">
      <div class="char a">A</div>
      <div class="char n">N</div>
      <div class="char i">I</div>
      <div class="char p">P</div>
      <div class="char l">L</div>
      <div class="char e">E</div>
      <div class="char x">X</div>
      <!-- 每个字符的修饰外框 -->
      <div class="rect a"></div>
      <div class="rect n"></div>
      <div class="rect i"></div>
      <div class="rect p"></div>
      <div class="rect l"></div>
      <div class="rect e"></div>
      <div class="rect x"></div>
      <!-- 【P】旋转角度(y轴 90deg)原因，需特殊处理 -->
      <div class="p-rect-90deg"></div>
    </div>
  </div>
</body>

</html>
